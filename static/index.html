<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Grok</title>
    <link rel="icon" href="/assets/favicon.svg?v=18" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/grok-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Noto+Serif+SC:wght@400;500;600&family=Noto+Serif+JP:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css" id="hl-light" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css"
      id="hl-dark"
      disabled
    />
    <link rel="stylesheet" href="/assets/styles.css?v=55" />
    <style>
      .drop-overlay,
      #dropOverlay {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <button class="brand" id="brandBtn" type="button" data-i18n-title="newChat">
            <span class="mark" aria-hidden="true">
              <img src="/assets/grok-mark.svg" alt="" />
            </span>
            <span data-i18n="brand">Grok</span>
          </button>
          <button class="icon-btn mobile-only" id="closeSidebar" type="button" data-i18n-aria="aria.closeSidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>

        <button class="new-chat" id="newChat" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span data-i18n="newChat">新对话</span>
        </button>

        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="11" cy="11" r="6.5" />
            <path d="M16 16l5 5" />
          </svg>
          <input id="search" type="search" data-i18n-placeholder="search.placeholder" placeholder="搜索对话" autocomplete="off" />
        </div>
        <div class="src-filter" id="srcFilter">
          <button type="button" class="src-chip active" data-src="all" data-i18n="filter.all">全部</button>
          <button type="button" class="src-chip" data-src="web" data-i18n="filter.web">网页</button>
          <button type="button" class="src-chip" data-src="cli" data-i18n="filter.cli">CLI</button>
        </div>

        <nav class="recents" id="recents"></nav>

        <div class="sidebar-foot">
          <button class="user-chip" id="openSettings" type="button">
            <span class="avatar" id="avatar">G</span>
            <span class="user-meta">
              <span class="user-name" id="userName">Grok</span>
              <span class="user-sub" id="userSub">本地对话</span>
            </span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
              <circle cx="12" cy="12" r="3.2" />
              <path d="M12 3.6v1.8M12 18.6v1.8M20.4 12h-1.8M5.4 12H3.6M17.9 6.1l-1.3 1.3M7.4 16.6l-1.3 1.3M17.9 17.9l-1.3-1.3M7.4 7.4L6.1 6.1" />
            </svg>
          </button>
        </div>
      </aside>
      <div class="gutter" id="gutterLeft" role="separator" aria-orientation="vertical"></div>

      <main class="main welcome" id="main">
        <header class="topbar">
          <button class="icon-btn" id="openSidebar" type="button" data-i18n-aria="aria.openSidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
          <div class="model-picker" id="modelPicker">
            <button class="model-btn" id="modelBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="modelLabel">Grok 4.6</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M7 9.5 12 14.5 17 9.5" />
              </svg>
            </button>
            <div class="model-menu" id="modelMenu" hidden role="listbox"></div>
          </div>
          <div class="model-picker" id="effortPicker">
            <button class="model-btn" id="effortBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="effortLabel">High</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M7 9.5 12 14.5 17 9.5" />
              </svg>
            </button>
            <div class="model-menu" id="effortMenu" hidden role="listbox"></div>
          </div>
          <div class="topbar-right">
            <div class="model-picker lang-picker" id="langPicker">
              <button class="ghost-btn lang-btn" id="langBtn" type="button" aria-haspopup="listbox" aria-expanded="false" data-i18n-title="lang.label" title="语言">
                <span id="langLabel">中文</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path d="M7 9.5 12 14.5 17 9.5" />
                </svg>
              </button>
              <div class="model-menu lang-menu" id="langMenu" hidden role="listbox"></div>
            </div>
            <button class="ghost-btn" id="themeBtn" type="button" data-i18n="appearance">外观</button>
          </div>
        </header>

        <div class="stage" id="stage">
        <section class="thread" id="thread">
          <div class="hero" id="hero">
            <h1 id="greeting" data-i18n="greeting.plain">今天想聊点什么？</h1>
          </div>
          <div class="messages" id="messages" hidden></div>
        </section>

        <div class="composer-dock">
          <div class="composer" id="composer">
            <div class="slash" id="slash" hidden></div>
            <div class="chips" id="chips" hidden></div>
            <div class="composer-row">
              <button class="icon-btn attach" id="attachBtn" type="button" data-i18n-title="attach" data-i18n-aria="attach">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M12 5v14M5 12h14" />
                </svg>
              </button>
              <div class="composer-field">
                <span class="mode-chip" id="modeChip" hidden></span>
                <textarea
                  id="input"
                  rows="1"
                  data-i18n-placeholder="input.placeholder"
                  placeholder="问任何问题，或输入 / 选择模式"
                  enterkeyhint="send"
                ></textarea>
              </div>
              <button class="send" id="sendBtn" type="button" disabled data-i18n-aria="send">
                <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 19V6M6.5 11.5 12 6l5.5 5.5" />
                </svg>
                <svg class="stop-icon" viewBox="0 0 24 24" fill="currentColor">
                  <rect x="7" y="7" width="10" height="10" rx="1.6" />
                </svg>
              </button>
            </div>
          </div>
          <div class="starters" id="starters">
            <button type="button" data-mode="research" data-i18n="starter.research">深度研究</button>
            <button type="button" data-mode="code" data-i18n="starter.code">写代码</button>
            <button type="button" data-mode="write" data-i18n="starter.write">帮我写作</button>
            <button type="button" data-mode="web" data-i18n="starter.web">查一下网页</button>
            <button type="button" data-mode="multi" data-i18n="starter.multi">多 Agent</button>
          </div>
        </div>
        </div>
      </main>
      <div class="gutter gutter-right" id="gutterRight" hidden role="separator" aria-orientation="vertical"></div>
      <aside class="inspect" id="inspect" hidden>
        <header class="inspect-head">
          <h2 id="inspectTitle" data-i18n="inspect.process">过程</h2>
          <button class="icon-btn" id="closeInspect" type="button" data-i18n-aria="close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </header>
        <div class="inspect-body" id="inspectBody">
          <div id="inspectRoster"></div>
          <div id="inspectDetail"></div>
        </div>
        <div class="inspect-guide" id="inspectGuide" hidden>
          <div class="inspect-guide-head">
            <span id="inspectGuideLabel"></span>
          </div>
          <div class="inspect-guide-row">
            <textarea id="inspectGuideInput" rows="1"></textarea>
            <button type="button" id="inspectGuideSend" data-i18n="inspect.guideSend">送出</button>
          </div>
          <p class="inspect-guide-hint" id="inspectGuideHint"></p>
        </div>
        <div class="gutter gutter-x" id="gutterGraph" hidden role="separator" aria-orientation="horizontal"></div>
        <div class="inspect-graph" id="inspectGraph" hidden>
          <div class="inspect-graph-head">
            <p class="inspect-graph-label" data-i18n="inspect.graph">关系</p>
            <div class="graph-legend">
              <span class="gl gl-live" data-i18n="inspect.graphLive">工作中</span>
              <span class="gl gl-link" data-i18n="inspect.graphLink">对齐中</span>
              <span class="gl gl-ask" data-i18n="inspect.graphAsk">反馈</span>
            </div>
          </div>
          <canvas id="agentGraph"></canvas>
        </div>
      </aside>
      <aside class="theme-panel" id="themePanel" hidden>
        <header class="inspect-head">
          <h2 data-i18n="appearance">外观</h2>
          <button class="icon-btn" id="closeTheme" type="button" data-i18n-aria="close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </header>
        <div class="theme-body">
          <p class="help" data-i18n="theme.hint">预览并选择外观。</p>
          <div class="theme-grid" data-theme-grid></div>
        </div>
      </aside>
    </div>

    <input id="fileInput" type="file" multiple hidden />

    <dialog class="modal" id="settings">
      <div class="settings-shell">
        <aside class="settings-nav">
          <p class="settings-kicker" data-i18n="settings">设置</p>
          <button type="button" class="settings-tab active" data-set-tab="account" data-i18n="tab.account">账号</button>
          <button type="button" class="settings-tab" data-set-tab="agents" data-i18n="tab.agents">多 Agent</button>
          <button type="button" class="settings-tab" data-set-tab="appearance" data-i18n="tab.appearance">外观</button>
          <button type="button" class="settings-tab" data-set-tab="language" data-i18n="tab.language">语言</button>
        </aside>
        <div class="settings-main">
          <header>
            <h2 id="settingsTitle" data-i18n="tab.account">账号</h2>
            <button class="icon-btn" id="closeSettings" type="button" data-i18n-aria="close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M6 6l12 12M18 6L6 18" />
              </svg>
            </button>
          </header>
          <div class="settings-scroll">
            <section class="settings-pane" data-set-pane="account">
              <div class="field">
                <label data-i18n="auth.status">登录状态</label>
                <p class="status-line" id="authStatus">检查中…</p>
              </div>
              <div class="field">
                <label for="apiKey" data-i18n="auth.keyLabel">API 密钥（可选）</label>
                <input id="apiKey" type="password" data-i18n-placeholder="auth.keyPh" placeholder="留空则沿用当前登录" autocomplete="off" />
                <p class="help" data-i18n="auth.keyHelp">密钥仅保存在此设备，可用于覆盖当前登录。</p>
              </div>
              <div class="actions">
                <button type="button" class="ghost-btn" id="clearKey" data-i18n="auth.clear">清除自定义密钥</button>
                <button type="button" class="primary-btn" id="saveKey" data-i18n="auth.save">保存密钥</button>
              </div>
            </section>
            <section class="settings-pane" data-set-pane="agents" hidden>
              <div class="field">
                <label data-i18n="agents.lead">总控模型</label>
                <div class="pick-row">
                  <div class="model-picker set-picker" id="leadModelPicker">
                    <button class="model-btn" id="leadModelBtn" type="button">
                      <span id="leadModelLabel">Grok 4.6</span>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 9.5 12 14.5 17 9.5" /></svg>
                    </button>
                    <div class="model-menu" id="leadModelMenu" hidden></div>
                  </div>
                  <div class="model-picker set-picker" id="leadEffortPicker">
                    <button class="model-btn" id="leadEffortBtn" type="button">
                      <span id="leadEffortLabel">High</span>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 9.5 12 14.5 17 9.5" /></svg>
                    </button>
                    <div class="model-menu" id="leadEffortMenu" hidden></div>
                  </div>
                </div>
                <p class="help" data-i18n="agents.leadHelp">用于拆分任务并生成最终回答。</p>
              </div>
              <div class="field">
                <label data-i18n="agents.worker">子代理模型</label>
                <div class="pick-row">
                  <div class="model-picker set-picker" id="workerModelPicker">
                    <button class="model-btn" id="workerModelBtn" type="button">
                      <span id="workerModelLabel">Grok 4.5</span>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 9.5 12 14.5 17 9.5" /></svg>
                    </button>
                    <div class="model-menu" id="workerModelMenu" hidden></div>
                  </div>
                  <div class="model-picker set-picker" id="workerEffortPicker">
                    <button class="model-btn" id="workerEffortBtn" type="button">
                      <span id="workerEffortLabel">Medium</span>
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 9.5 12 14.5 17 9.5" /></svg>
                    </button>
                    <div class="model-menu" id="workerEffortMenu" hidden></div>
                  </div>
                </div>
                <p class="help" data-i18n="agents.workerHelp">用于执行各项子任务。滑块是上限，实际人数按任务需要决定。</p>
              </div>
              <div class="field">
                <div class="slider-head">
                  <label for="workerCount" data-i18n="agents.count">子代理上限</label>
                  <span id="workerCountVal">3</span>
                </div>
                <div class="slider-wrap">
                  <input id="workerCount" type="range" min="2" max="144" step="1" value="3" />
                </div>
                <div class="slider-ticks"><span>2</span><span>144</span></div>
                <div class="count-warn" id="workerCountWarn" hidden>
                  <p id="workerCountWarnText"></p>
                  <button type="button" id="workerCountSuggest" data-i18n="agents.warnUse8">改为 8</button>
                </div>
              </div>
              <div class="field">
                <div class="slider-head">
                  <label for="budgetTokens" data-i18n="agents.budget">本轮预算</label>
                  <span id="budgetTokensVal">♾️</span>
                </div>
                <div class="slider-wrap">
                  <input id="budgetTokens" type="range" min="0" max="10" step="1" value="10" />
                </div>
                <div class="slider-ticks"><span data-i18n="agents.budgetLow">省</span><span>♾️</span></div>
                <p class="help" data-i18n="agents.budgetHelp">这一轮多 Agent 能花的 token 上限。拉到最右为不限；偏低时会少派专员、少返工，用满就转入汇总。</p>
              </div>
            </section>
            <section class="settings-pane" data-set-pane="appearance" hidden>
              <p class="help" data-i18n="theme.hint">预览并选择外观。</p>
              <div class="theme-grid settings-theme-grid" data-theme-grid></div>
            </section>
            <section class="settings-pane" data-set-pane="language" hidden>
              <div class="field">
                <label data-i18n="lang.label">语言</label>
                <div class="choice-row lang-choices">
                  <button type="button" class="choice-btn" data-lang-set="zh">中文</button>
                  <button type="button" class="choice-btn" data-lang-set="en">English</button>
                  <button type="button" class="choice-btn" data-lang-set="ja">日本語</button>
                </div>
                <p class="help" data-i18n="lang.help">选择界面语言。</p>
              </div>
            </section>
          </div>
        </div>
      </div>
    </dialog>

    <dialog class="modal" id="cmdDialog">
      <form method="dialog" class="modal-card">
        <header>
          <h2 id="cmdTitle" data-i18n="cmd">命令</h2>
          <button class="icon-btn" value="close" aria-label="关闭">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </header>
        <div class="modal-body" id="cmdBody"></div>
      </form>
    </dialog>

    <dialog class="modal" id="renameDialog">
      <form method="dialog" class="modal-card compact">
        <header>
          <h2 data-i18n="rename.title">重命名对话</h2>
        </header>
        <div class="modal-body">
          <input id="renameInput" type="text" maxlength="80" />
          <div class="actions">
            <button value="cancel" class="ghost-btn" data-i18n="cancel">取消</button>
            <button value="ok" class="primary-btn" id="renameConfirm" data-i18n="save">保存</button>
          </div>
        </div>
      </form>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.5/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/common.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
    <script src="/assets/app.js?v=59"></script>
  </body>
</html>
