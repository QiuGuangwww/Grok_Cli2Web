<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-label="Multi-agent flow with Brain, fact contract, and scored review">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1.4L8.4 5 1 8.6z" fill="#8a8478"/>
    </marker>
    <marker id="arr-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1.4L8.4 5 1 8.6z" fill="#3a8f5e"/>
    </marker>
    <marker id="arr-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1.4L8.4 5 1 8.6z" fill="#c48432"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1.4L8.4 5 1 8.6z" fill="#c96442"/>
    </marker>
  </defs>

  <rect width="880" height="560" rx="20" fill="#fffdf8"/>
  <rect x="1" y="1" width="878" height="558" rx="19" fill="none" stroke="#e8e2d6"/>

  <rect x="372" y="16" width="136" height="34" rx="17" fill="#fff" stroke="#c4bdb0"/>
  <text x="440" y="38" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1c1915">You</text>

  <path d="M372 33H96V108H236" fill="none" stroke="#c48432" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr-ask)"/>
  <text x="88" y="64" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c48432">one batched ask</text>
  <text x="88" y="80" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c48432">not a popup storm</text>

  <path d="M508 33H784V108H644" fill="none" stroke="#c96442" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr-accent)"/>
  <text x="792" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c96442">steer writes back</text>
  <text x="792" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c96442">new plan version</text>

  <path d="M440 50v18" stroke="#8a8478" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="236" y="70" width="408" height="70" rx="14" fill="#f4e4d6" stroke="#c96442"/>
  <text x="440" y="98" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1c1915">Brain</text>
  <text x="440" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6b645a">plan vN · contract · verify · disputed · score · budget</text>
  <text x="440" y="132" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#8a8478">goal is pinned · later agents never see full essays</text>

  <path d="M440 140v20" stroke="#8a8478" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="108" y="164" width="664" height="132" rx="16" fill="#faf7f1" stroke="#e8e2d6"/>
  <text x="128" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#8a8478">one step · several specialists in parallel</text>
  <text x="752" y="184" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#8a8478">stall: retry · swap · shrink</text>

  <rect x="136" y="198" width="150" height="36" rx="10" fill="#fff" stroke="#c4bdb0"/>
  <text x="211" y="221" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1c1915">Specialist</text>
  <rect x="306" y="198" width="150" height="36" rx="10" fill="#fff" stroke="#c4bdb0"/>
  <text x="381" y="221" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1c1915">Specialist</text>
  <rect x="476" y="198" width="264" height="36" rx="10" fill="#eef5ee" stroke="#6d8a6a"/>
  <text x="608" y="221" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1c1915">Step lead aligns</text>

  <path d="M286 216h16" stroke="#3a8f5e" stroke-width="1.5" marker-end="url(#arr-live)"/>
  <path d="M456 216h16" stroke="#3a8f5e" stroke-width="1.5" marker-end="url(#arr-live)"/>

  <rect x="136" y="248" width="604" height="32" rx="8" fill="#fff" stroke="#d9d2c6"/>
  <text x="438" y="269" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1c1915">Contract · contested → verify once · equally sourced split → disputed</text>

  <text x="438" y="288" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c48432">don’t guess · ask a teammate · similar asks are merged</text>

  <path d="M440 296v20" stroke="#8a8478" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="330" y="320" width="220" height="42" rx="12" fill="#fff" stroke="#c4bdb0"/>
  <text x="440" y="346" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1c1915">Reviewer</text>

  <path d="M330 341H200v36" fill="none" stroke="#3a8f5e" stroke-width="1.5" marker-end="url(#arr-live)"/>
  <text x="258" y="334" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#3a8f5e">pass if score ok</text>

  <path d="M550 341H680v36" fill="none" stroke="#c48432" stroke-width="1.5" marker-end="url(#arr-ask)"/>
  <text x="628" y="334" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c48432">send back</text>

  <rect x="98" y="384" width="204" height="52" rx="12" fill="#eef5ee" stroke="#6d8a6a"/>
  <text x="200" y="406" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1c1915">Lead writes answer</text>
  <text x="200" y="424" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#8a8478">from contract + artifacts</text>

  <rect x="338" y="390" width="204" height="40" rx="10" fill="#fff" stroke="#e8e2d6"/>
  <text x="440" y="408" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6b645a">score · coverage · confidence</text>
  <text x="440" y="422" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#6b645a">conflicts · acceptance · cap 2</text>

  <rect x="578" y="384" width="204" height="52" rx="12" fill="#f7ecd8" stroke="#c48432"/>
  <text x="680" y="406" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1c1915">Rework · reuse agents</text>
  <text x="680" y="424" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#8a8478">changelog of what changed</text>

  <path d="M338 410H306" stroke="#3a8f5e" stroke-width="1.3" marker-end="url(#arr-live)"/>
  <path d="M542 410H574" stroke="#c48432" stroke-width="1.3" marker-end="url(#arr-ask)"/>

  <path d="M782 410H816V230H744" fill="none" stroke="#c96442" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="824" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c96442">rework</text>
  <text x="824" y="334" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c96442">same agents</text>
  <text x="824" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c96442">new premises</text>

  <text x="440" y="468" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#6b645a">A documented split is a fact. Report both sides — do not keep verifying. Steer writes back to Brain.</text>

  <rect x="128" y="488" width="624" height="48" rx="12" fill="#fff" stroke="#e8e2d6"/>
  <text x="440" y="508" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1c1915">Inspect · live graph · guidance box</text>
  <text x="440" y="524" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#8a8478">green = working · amber = feedback · drag nodes · empty process hides the button</text>
</svg>
