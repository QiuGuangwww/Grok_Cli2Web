<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" role="img" aria-label="Multi-agent flow">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1.4L8.4 5 1 8.6z" fill="#8a8478"/>
    </marker>
    <marker id="arr-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1.4L8.4 5 1 8.6z" fill="#3a8f5e"/>
    </marker>
    <marker id="arr-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1.4L8.4 5 1 8.6z" fill="#c48432"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1.4L8.4 5 1 8.6z" fill="#c96442"/>
    </marker>
  </defs>

  <rect width="880" height="460" rx="20" fill="#fffdf8"/>
  <rect x="1" y="1" width="878" height="458" rx="19" fill="none" stroke="#e8e2d6"/>

  <rect x="372" y="22" width="136" height="36" rx="18" fill="#fff" stroke="#c4bdb0"/>
  <text x="440" y="45" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1c1915">You</text>

  <path d="M440 58v22" stroke="#8a8478" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="340" y="82" width="200" height="42" rx="12" fill="#f4e4d6" stroke="#c96442"/>
  <text x="440" y="108" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1c1915">Lead plans steps</text>

  <path d="M440 124v22" stroke="#8a8478" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="148" y="150" width="584" height="100" rx="16" fill="#faf7f1" stroke="#e8e2d6"/>
  <text x="168" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#8a8478">one step · several specialists</text>

  <rect x="176" y="186" width="150" height="38" rx="10" fill="#fff" stroke="#c4bdb0"/>
  <text x="251" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1c1915">Specialist</text>
  <rect x="346" y="186" width="150" height="38" rx="10" fill="#fff" stroke="#c4bdb0"/>
  <text x="421" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1c1915">Specialist</text>
  <rect x="516" y="186" width="186" height="38" rx="10" fill="#eef5ee" stroke="#6d8a6a"/>
  <text x="609" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1c1915">Step lead aligns</text>

  <path d="M326 205h16" stroke="#3a8f5e" stroke-width="1.5" marker-end="url(#arr-live)"/>
  <path d="M496 205h16" stroke="#3a8f5e" stroke-width="1.5" marker-end="url(#arr-live)"/>
  <text x="336" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c48432">don’t guess · ask a teammate</text>

  <path d="M440 250v20" stroke="#8a8478" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="350" y="274" width="180" height="42" rx="12" fill="#fff" stroke="#c4bdb0"/>
  <text x="440" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1c1915">Reviewer</text>

  <path d="M350 295H210v40" fill="none" stroke="#3a8f5e" stroke-width="1.5" marker-end="url(#arr-live)"/>
  <text x="268" y="288" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#3a8f5e">pass</text>

  <path d="M530 295H670v40" fill="none" stroke="#c48432" stroke-width="1.5" marker-end="url(#arr-ask)"/>
  <text x="612" y="288" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c48432">send back</text>

  <rect x="118" y="342" width="184" height="42" rx="12" fill="#eef5ee" stroke="#6d8a6a"/>
  <text x="210" y="368" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1c1915">Lead writes answer</text>

  <rect x="578" y="342" width="184" height="42" rx="12" fill="#f7ecd8" stroke="#c48432"/>
  <text x="670" y="368" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1c1915">Lead decides</text>

  <path d="M578 363H310" stroke="#3a8f5e" stroke-width="1.4" marker-end="url(#arr-live)"/>
  <text x="444" y="356" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#3a8f5e">good enough</text>

  <path d="M762 363H808V200H706" fill="none" stroke="#c96442" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="816" y="286" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c96442">rework</text>
  <text x="816" y="302" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c96442">reuse</text>

  <path d="M372 40H108V205H172" fill="none" stroke="#c96442" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr-accent)"/>
  <text x="118" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c96442">guide while</text>
  <text x="118" y="144" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c96442">running</text>
