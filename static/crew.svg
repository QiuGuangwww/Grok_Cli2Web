<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" role="img" aria-label="Multi-agent flow">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1.4L8.4 5 1 8.6z" fill="#8a8478"/>
    </marker>
    <marker id="arr-live" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1.4L8.4 5 1 8.6z" fill="#3a8f5e"/>
    </marker>
    <marker id="arr-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1.4L8.4 5 1 8.6z" fill="#c48432"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1.4L8.4 5 1 8.6z" fill="#c96442"/>
    </marker>
  </defs>

  <rect width="880" height="470" rx="20" fill="#fffdf8"/>
  <rect x="1" y="1" width="878" height="468" rx="19" fill="none" stroke="#e8e2d6"/>

  <rect x="372" y="22" width="136" height="36" rx="18" fill="#fff" stroke="#c4bdb0"/>
  <text x="440" y="45" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1c1915">You</text>

  <path d="M440 58v22" stroke="#8a8478" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="328" y="82" width="224" height="42" rx="12" fill="#f4e4d6" stroke="#c96442"/>
  <text x="440" y="108" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1c1915">Lead plans steps</text>

  <path d="M328 103H250V40H368" fill="none" stroke="#c48432" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr-ask)"/>
  <text x="238" y="76" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c48432">ask if unsure</text>

  <path d="M440 124v22" stroke="#8a8478" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="148" y="150" width="584" height="104" rx="16" fill="#faf7f1" stroke="#e8e2d6"/>
  <text x="168" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#8a8478">one step · several specialists</text>
  <text x="716" y="170" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#8a8478">stall: retry · swap · shrink</text>

  <rect x="176" y="186" width="150" height="38" rx="10" fill="#fff" stroke="#c4bdb0"/>
  <text x="251" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1c1915">Specialist</text>
  <rect x="346" y="186" width="150" height="38" rx="10" fill="#fff" stroke="#c4bdb0"/>
  <text x="421" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1c1915">Specialist</text>
  <rect x="516" y="186" width="186" height="38" rx="10" fill="#eef5ee" stroke="#6d8a6a"/>
  <text x="609" y="210" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1c1915">Step lead aligns</text>

  <path d="M326 205h16" stroke="#3a8f5e" stroke-width="1.5" marker-end="url(#arr-live)"/>
  <path d="M496 205h16" stroke="#3a8f5e" stroke-width="1.5" marker-end="url(#arr-live)"/>
  <text x="336" y="242" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c48432">don’t guess · ask a teammate</text>

  <path d="M440 254v18" stroke="#8a8478" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="350" y="276" width="180" height="42" rx="12" fill="#fff" stroke="#c4bdb0"/>
  <text x="440" y="302" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1c1915">Reviewer</text>

  <path d="M350 297H210v42" fill="none" stroke="#3a8f5e" stroke-width="1.5" marker-end="url(#arr-live)"/>
  <text x="268" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#3a8f5e">pass</text>

  <path d="M530 297H670v42" fill="none" stroke="#c48432" stroke-width="1.5" marker-end="url(#arr-ask)"/>
  <text x="612" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c48432">send back</text>

  <rect x="118" y="346" width="184" height="42" rx="12" fill="#eef5ee" stroke="#6d8a6a"/>
  <text x="210" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#1c1915">Lead writes answer</text>

  <rect x="568" y="346" width="204" height="42" rx="12" fill="#f7ecd8" stroke="#c48432"/>
  <text x="670" y="366" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1c1915">State machine</text>
  <text x="670" y="382" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#8a8478">running · sent back · stop</text>

  <path d="M568 367H310" stroke="#3a8f5e" stroke-width="1.4" marker-end="url(#arr-live)"/>
  <text x="438" y="360" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#3a8f5e">cap or pass</text>

  <path d="M772 367H808V200H706" fill="none" stroke="#c96442" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="816" y="288" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c96442">rework</text>
  <text x="816" y="304" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c96442">reuse</text>

  <path d="M372 40H108V205H172" fill="none" stroke="#c96442" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arr-accent)"/>
  <text x="118" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c96442">guide while</text>
  <text x="118" y="144" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#c96442">running</text>
</svg>
